<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Light Night</title>

  <!-- Google Fonts: Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" />

  <!-- Tailwind CSS via official CDN (JIT browser build) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* ─── CSS Custom Properties ──────────────────────────────────────────── */
    :root {
      --char-coat:  #0D0D1A;
      --char-navy:  #1A1A3E;
      --char-skin:  #C8A882;
      --char-accent: #E8E8FF;
      --char-glow-color: #7B6FC4;
    }

    /* ─── Base ───────────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      font-family: 'Manrope', 'Inter', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: linear-gradient(160deg, #0F1020 0%, #17152D 30%, #242044 65%, #34305C 100%);
      background-attachment: fixed;
      min-height: 100vh;
    }

    /* ─── Background Layers ──────────────────────────────────────────────── */
    #bg-radial,
    #bg-accents {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Glassmorphism Utility ──────────────────────────────────────────── */
    .glass {
      /* Fallback for browsers without backdrop-filter support */
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 1.5rem;       /* rounded-3xl */
      border: 1px solid rgba(255, 255, 255, 0.20);
    }

    /* ─── @keyframes: float ──────────────────────────────────────────────── */
    /*  Gentle vertical bob for the character container — 3 s, infinite      */
    @keyframes float {
      0%   { transform: translateY(0px); }
      50%  { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .animate-float {
      animation: float 3s ease-in-out infinite;
    }

    /* ─── @keyframes: scale-bounce ───────────────────────────────────────── */
    /*  Quick grow-and-return on character click — 400 ms                    */
    @keyframes scale-bounce {
      0%   { transform: scale(1.0); }
      40%  { transform: scale(1.25); }
      100% { transform: scale(1.0); }
    }

    .scale-bounce {
      animation: scale-bounce 400ms cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
    }

    /* ─── @keyframes: pulse-glow ─────────────────────────────────────────── */
    /*  Radial glow ring expand + fade behind character — 600 ms             */
    @keyframes pulse-glow {
      0%   { transform: scale(0.6); opacity: 0; }
      40%  { transform: scale(1.0); opacity: 0.5; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    .pulse-glow {
      animation: pulse-glow 600ms ease-out forwards;
    }

    /* ─── @keyframes: particle-fly ───────────────────────────────────────── */
    /*  Each particle uses CSS custom props --dx and --dy for direction       */
    @keyframes particle-fly {
      0%   { transform: translate(0, 0) scale(1);   opacity: var(--opacity, 0.8); }
      80%  { transform: translate(calc(var(--dx, 0px) * 0.8), calc(var(--dy, 0px) * 0.8)) scale(0.6); opacity: calc(var(--opacity, 0.8) * 0.3); }
      100% { transform: translate(var(--dx, 0px), var(--dy, 0px)) scale(0);   opacity: 0; }
    }

    .particle {
      position: fixed;
      pointer-events: none;
      animation: particle-fly 1200ms ease-out forwards;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── @keyframes: fade-in ────────────────────────────────────────────── */
    /*  Reaction quote entrance — 300 ms                                      */
    @keyframes fade-in {
      0%   { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fade-in 300ms ease-out forwards;
    }

    /* ─── Layout Overflow Guard ─────────────────────────────────────────── */
    html, body {
      overflow-x: hidden;
      max-width: 100vw;
    }

    #app {
      max-width: 100%;
    }

    /* ─── Mood Label Transition ─────────────────────────────────────────── */
    #mood-label {
      transition: opacity 300ms ease;
    }

    /* Character SVG focus ring */
    #character-svg:focus {
      outline: 2px solid rgba(150, 100, 255, 0.8);
      outline-offset: 8px;
      border-radius: 50%;
    }
    #character-svg:focus:not(:focus-visible) {
      outline: none;
    }
    #character-svg:focus-visible {
      outline: 2px solid rgba(150, 100, 255, 0.8);
      outline-offset: 8px;
      border-radius: 50%;
    }

    /* Character active state — toggled by JS */
    #character-svg.character-active #char-eyes-active {
      opacity: 1;
    }
    #character-svg.character-active #char-eyes {
      opacity: 0;
    }
    #character-svg.character-active #char-accent {
      opacity: 0.9;
      filter: drop-shadow(0 0 4px rgba(232,232,255,0.6));
    }
    #character-svg.character-active #char-glow {
      filter: blur(8px);
      opacity: 1.0;
    }

    /* Transitions on char groups */
    #char-eyes, #char-eyes-active, #char-accent, #char-glow {
      transition: opacity 300ms ease, filter 300ms ease;
    }

    /* ─── Prevent particle overflow from causing scrollbars ─────────────── */
    #particle-container {
      overflow: hidden;
    }

    /* ─── Reaction area min-height prevents layout jumps ─────────────────── */
    #reaction-area {
      min-height: 64px;
    }

    /* ─── Performance Hints ─────────────────────────────────────────────── */
    /* Promote animated elements to their own compositor layers             */
    #character-svg {
      will-change: transform;
    }
    #glow-ring {
      will-change: transform, opacity;
    }

    /* ─── Reduced-Motion Overrides ───────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

  <!-- ─── Background: radial moonlight overlay ─────────────────────────── -->
  <div id="bg-radial" aria-hidden="true" style="
    background: radial-gradient(ellipse 60% 60% at 50% 50%,
      rgba(100, 130, 255, 0.10) 0%,
      transparent 100%);
  "></div>

  <!-- ─── Background: ambient glow accents ────────────────────────────── -->
  <div id="bg-accents" aria-hidden="true">
    <!-- Blue accent — upper-center -->
    <div style="
      position: absolute;
      top: 8%;
      left: 25%;
      width: 50%;
      height: 30%;
      background: radial-gradient(ellipse at center,
        rgba(100, 130, 255, 0.10) 0%,
        transparent 70%);
      filter: blur(100px);
    "></div>
    <!-- Violet accent — lower-center -->
    <div style="
      position: absolute;
      bottom: 10%;
      left: 25%;
      width: 50%;
      height: 30%;
      background: radial-gradient(ellipse at center,
        rgba(150, 100, 255, 0.08) 0%,
        transparent 70%);
      filter: blur(80px);
    "></div>
    <!-- White accent — center -->
    <div style="
      position: absolute;
      top: 35%;
      left: 25%;
      width: 50%;
      height: 30%;
      background: radial-gradient(ellipse at center,
        rgba(232, 232, 255, 0.05) 0%,
        transparent 70%);
      filter: blur(40px);
    "></div>
  </div>

  <div id="app" class="relative z-10 flex flex-col items-center justify-center min-h-screen gap-6 px-4 py-8 w-full">
    <header class="text-center mb-2">
      <h1 class="font-extrabold tracking-widest uppercase text-white" style="letter-spacing: 0.18em; font-size: clamp(1.75rem, 6vw, 5rem); text-shadow: 0 0 40px rgba(180,160,255,0.4);">
        LIGHT NIGHT
      </h1>
      <p class="text-white/60 font-light mt-2" style="font-size: clamp(0.75rem, 2vw, 1.1rem); letter-spacing: 0.05em;">
        Find your light in the quiet of the night.
      </p>
    </header>

    <div id="stats-bar" class="flex flex-row gap-4 items-stretch justify-center">
      <!-- Counter Component -->
      <div id="counter-component" class="glass flex flex-col items-center justify-center px-6 py-3 min-w-[120px]" aria-label="Interaction counter">
        <span class="text-white/50 text-xs font-semibold tracking-widest uppercase">Interactions</span>
        <span id="counter-value" class="text-white text-3xl font-bold mt-1" aria-live="polite" aria-atomic="true">0</span>
      </div>
      <!-- Status Display -->
      <div id="status-display" class="glass flex flex-col items-center justify-center px-6 py-3 min-w-[120px]" aria-label="Current mood status">
        <span class="text-white/50 text-xs font-semibold tracking-widest uppercase">Mood</span>
        <span id="mood-label" class="text-white text-lg font-bold mt-1 tracking-widest" style="transition: opacity 300ms ease;">CALM</span>
      </div>
    </div>

    <!-- ─── Character Container ─────────────────────────────────────────────── -->
    <div id="character-container" class="relative flex items-center justify-center animate-float" style="width: clamp(240px, 40vw, 480px); height: clamp(240px, 40vw, 480px);">
      
      <!-- Glow ring — renders BEHIND the character -->
      <div id="glow-ring" class="absolute inset-0 rounded-full pointer-events-none" style="
        background: radial-gradient(ellipse at center, rgba(123,111,196,0.45) 0%, rgba(100,130,255,0.20) 40%, transparent 70%);
        transform: scale(0.6);
        opacity: 0;
        z-index: 0;
        filter: blur(8px);
      "></div>

      <!-- The Light Night Character SVG -->
      <svg id="character-svg"
        viewBox="0 0 200 320"
        xmlns="http://www.w3.org/2000/svg"
        role="button"
        tabindex="0"
        aria-label="Interact with Light Night"
        style="
          width: 75%;
          height: 75%;
          position: relative;
          z-index: 1;
          cursor: pointer;
          -webkit-tap-highlight-color: transparent;
          outline: none;
          filter: drop-shadow(0 0 12px rgba(123,111,196,0.35));
        ">
        <defs>
          <!-- Glow beneath feet -->
          <radialGradient id="footGlowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#7B6FC4" stop-opacity="0.7"/>
            <stop offset="60%" stop-color="#7B6FC4" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#7B6FC4" stop-opacity="0"/>
          </radialGradient>
          <!-- Skin gradient -->
          <radialGradient id="skinGrad" cx="50%" cy="40%" r="55%">
            <stop offset="0%" stop-color="#D4B896"/>
            <stop offset="100%" stop-color="#B8976A"/>
          </radialGradient>
          <!-- Coat gradient -->
          <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1A1A3E"/>
            <stop offset="100%" stop-color="#0D0D1A"/>
          </linearGradient>
        </defs>

        <!-- GROUP 1: Foot glow surface -->
        <g id="char-glow">
          <ellipse cx="100" cy="305" rx="55" ry="12" fill="url(#footGlowGrad)"/>
        </g>

        <!-- GROUP 2: Body / Coat -->
        <g id="char-body">
          <!-- Main coat torso -->
          <path d="M 60 160 L 55 290 L 145 290 L 140 160 Z" fill="url(#coatGrad)"/>
          <!-- Coat lapels / collar (angular V shape) -->
          <path d="M 80 155 L 100 190 L 120 155 L 110 148 L 100 165 L 90 148 Z" fill="#1A1A3E"/>
          <!-- Shoulder widening -->
          <path d="M 55 165 Q 45 170 48 185 L 58 185 L 60 165 Z" fill="#0D0D1A"/>
          <path d="M 145 165 Q 155 170 152 185 L 142 185 L 140 165 Z" fill="#0D0D1A"/>
        </g>

        <!-- GROUP 3: Head -->
        <g id="char-head">
          <!-- Neck -->
          <rect x="91" y="128" width="18" height="30" rx="4" fill="url(#skinGrad)"/>
          <!-- Head oval -->
          <ellipse cx="100" cy="105" rx="32" ry="38" fill="url(#skinGrad)"/>
          <!-- Subtle jaw definition -->
          <path d="M 72 115 Q 100 145 128 115" fill="none" stroke="#B8976A" stroke-width="0.5" opacity="0.4"/>
        </g>

        <!-- GROUP 4: Hair -->
        <g id="char-hair">
          <!-- Main hair mass — slicked back, dark -->
          <path d="M 68 98 Q 68 62 100 60 Q 132 62 132 98 Q 128 72 100 70 Q 72 72 68 98 Z" fill="#0D0D1A"/>
          <!-- Side temple definition -->
          <path d="M 68 98 Q 66 88 70 78 Q 72 95 68 98 Z" fill="#0A0A16"/>
          <path d="M 132 98 Q 134 88 130 78 Q 128 95 132 98 Z" fill="#0A0A16"/>
        </g>

        <!-- GROUP 5: Eyes (neutral) -->
        <g id="char-eyes">
          <!-- Left eye — almond shaped, calm -->
          <ellipse cx="86" cy="108" rx="7" ry="4.5" fill="#1A1A3E"/>
          <ellipse cx="86" cy="108" rx="4.5" ry="3" fill="#0D0D1A"/>
          <ellipse cx="84.5" cy="107" rx="1.5" ry="1.5" fill="#E8E8FF" opacity="0.6"/>
          <!-- Right eye — almond shaped, calm -->
          <ellipse cx="114" cy="108" rx="7" ry="4.5" fill="#1A1A3E"/>
          <ellipse cx="114" cy="108" rx="4.5" ry="3" fill="#0D0D1A"/>
          <ellipse cx="112.5" cy="107" rx="1.5" ry="1.5" fill="#E8E8FF" opacity="0.6"/>
          <!-- Subtle brows — calm, straight -->
          <path d="M 80 101 Q 86 99 92 101" stroke="#0D0D1A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M 108 101 Q 114 99 120 101" stroke="#0D0D1A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <!-- Closed / subtle mouth -->
          <path d="M 93 126 Q 100 129 107 126" stroke="#9A7B5A" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.7"/>
        </g>

        <!-- GROUP 6: Eyes Active (hidden by default, shown on interaction) -->
        <g id="char-eyes-active" opacity="0" style="transition: opacity 300ms ease;">
          <!-- Slightly brighter / wider eyes for active state -->
          <ellipse cx="86" cy="108" rx="7.5" ry="5" fill="#1A1A3E"/>
          <ellipse cx="86" cy="108" rx="5" ry="3.5" fill="#150F30"/>
          <ellipse cx="84" cy="106.5" rx="2" ry="2" fill="#E8E8FF" opacity="0.9"/>
          <ellipse cx="114" cy="108" rx="7.5" ry="5" fill="#1A1A3E"/>
          <ellipse cx="114" cy="108" rx="5" ry="3.5" fill="#150F30"/>
          <ellipse cx="112" cy="106.5" rx="2" ry="2" fill="#E8E8FF" opacity="0.9"/>
        </g>

        <!-- GROUP 7: Accent — moonlight glint on lapel/shoulder -->
        <g id="char-accent" opacity="0.35" style="transition: opacity 300ms ease, filter 300ms ease;">
          <!-- Lapel glint left -->
          <ellipse cx="88" cy="162" rx="3" ry="5" fill="#E8E8FF" opacity="0.7" transform="rotate(-15, 88, 162)"/>
          <!-- Lapel glint right -->
          <ellipse cx="112" cy="162" rx="3" ry="5" fill="#E8E8FF" opacity="0.7" transform="rotate(15, 112, 162)"/>
          <!-- Small star accent near collar -->
          <text x="98" y="148" font-size="6" fill="#E8E8FF" opacity="0.5" text-anchor="middle">✦</text>
        </g>

      </svg>

      <!-- Focus ring (visible on keyboard focus) -->
      <div class="absolute inset-0 rounded-full pointer-events-none" id="char-focus-ring" style="
        outline: none;
        box-shadow: none;
        transition: box-shadow 150ms ease;
      "></div>
    </div>

    <!-- ─── Reaction Area ────────────────────────────────────────────────────── -->
    <div id="reaction-area"
      class="glass w-full max-w-md text-center px-6 py-4 min-h-[64px] flex items-center justify-center"
      aria-live="polite"
      aria-atomic="false"
      style="min-height: 64px;">
      <p id="reaction-text" class="text-white/90 font-medium text-base sm:text-lg" style="font-size: clamp(0.875rem, 2.5vw, 1.125rem);"></p>
    </div>

    <!-- ─── CTA Button ──────────────────────────────────────────────────────── -->
    <button id="cta-button"
      class="glass font-semibold tracking-widest uppercase text-white/90 px-8 py-4 cursor-pointer"
      style="
        letter-spacing: 0.12em;
        font-size: clamp(0.75rem, 2vw, 0.9rem);
        min-width: 44px;
        min-height: 44px;
        box-shadow: 0 0 12px rgba(100,130,255,0.30), 0 0 24px rgba(150,100,255,0.15);
        transition: box-shadow 150ms ease, transform 150ms ease;
        -webkit-tap-highlight-color: transparent;
      "
      onmouseover="this.style.boxShadow='0 0 20px rgba(100,130,255,0.50), 0 0 40px rgba(150,100,255,0.25)'"
      onmouseout="this.style.boxShadow='0 0 12px rgba(100,130,255,0.30), 0 0 24px rgba(150,100,255,0.15)'"
    >
      Touch the Light
    </button>
  </div>

  <!-- ─── Particle Container ─────────────────────────────────────────────── -->
  <div id="particle-container" aria-hidden="true" style="position: fixed; inset: 0; pointer-events: none; z-index: 50;"></div>

  <script>
  // ─── Application State ────────────────────────────────────────────────────
  const state = {
    interactionCount: 0,    // integer ≥ 0 — total interactions this session
    currentMood: 'CALM',    // string from MOOD_LABELS
    currentQuote: null,     // string from QUOTES, or null before first interaction
    isAnimating: false      // boolean — debounce lock during animation sequence
  };

  // ─── Mood Labels (6 items) ───────────────────────────────────────────────
  const MOOD_LABELS = [
    'CALM',
    'FOCUSED',
    'REFLECTIVE',
    'MYSTERIOUS',
    'PEACEFUL',
    'ENERGETIC'
  ];

  // ─── Reaction Quotes (exactly 8 items) ───────────────────────────────────
  const QUOTES = [
    "Stay calm. The night is still young. 🌙",
    "Sometimes silence says everything.",
    "Keep moving. Your light is still there. ✨",
    "Don't rush. Everything has its own time.",
    "Even the darkest night has a light.",
    "Take a breath. You're doing fine.",
    "Some nights are meant for reflection.",
    "Keep your focus. Keep your light."
  ];

  // ─── Expose to window for test harness access ────────────────────────────
  window.appState = state;
  window.MOOD_LABELS = MOOD_LABELS;
  window.QUOTES = QUOTES;

  // ─── selectDifferent(pool, current) — Pure helper ─────────────────────────
  function selectDifferent(pool, current) {
    if (pool.length === 1) return pool[0];
    const candidates = pool.filter(item => item !== current);
    if (candidates.length === 0) {
      for (const item of pool) {
        if (item !== current) return item;
      }
      return pool[0];
    }
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  window.selectDifferent = selectDifferent;

  // ─── triggerScaleAnimation() ──────────────────────────────────────────────
  function triggerScaleAnimation() {
    if (!characterSvgEl) return;
    // Cancel current animation by removing class, forcing reflow, re-adding
    characterSvgEl.classList.remove('scale-bounce');
    void characterSvgEl.offsetWidth; // force reflow to restart animation
    characterSvgEl.classList.add('scale-bounce');
    
    clearTimeout(scaleTimer);
    scaleTimer = setTimeout(() => {
      characterSvgEl.classList.remove('scale-bounce');
    }, 400);
  }

  // ─── triggerGlowAnimation() ───────────────────────────────────────────────
  function triggerGlowAnimation() {
    if (!glowRingEl) return;
    glowRingEl.classList.remove('pulse-glow');
    void glowRingEl.offsetWidth; // force reflow
    glowRingEl.classList.add('pulse-glow');
    
    clearTimeout(glowTimer);
    glowTimer = setTimeout(() => {
      glowRingEl.classList.remove('pulse-glow');
      glowRingEl.style.opacity = '0';
      glowRingEl.style.transform = 'scale(0.6)';
    }, 600);
  }

  // ─── triggerCharacterActive() ─────────────────────────────────────────────
  function triggerCharacterActive() {
    if (!characterSvgEl) return;
    characterSvgEl.classList.add('character-active');
    
    clearTimeout(activeTimer);
    activeTimer = setTimeout(() => {
      characterSvgEl.classList.remove('character-active');
    }, 500);
  }

  // ─── spawnParticles(count) ────────────────────────────────────────────────
  function spawnParticles(count) {
    // Respect reduced-motion preference
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    // Cap at 60 simultaneous particles
    const currentCount = particleContainerEl ? particleContainerEl.children.length : 0;
    if (currentCount >= 60) return;
    const safeCount = Math.min(count, 60 - currentCount);

    // Get character center in viewport coordinates
    const charEl = characterSvgEl || document.getElementById('character-svg');
    if (!charEl) return;
    const rect = charEl.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const COLORS = ['#6482FF', '#9664FF', '#E8E8FF'];

    for (let i = 0; i < safeCount; i++) {
      const angle     = Math.random() * 360;
      const distance  = 60 + Math.random() * 80;  // 60–140px
      const rad       = (angle * Math.PI) / 180;
      const dx        = Math.cos(rad) * distance;
      const dy        = Math.sin(rad) * distance;
      const size      = Math.random() < 0.5
        ? (4 + Math.random() * 6)    // circle 4–10px
        : (8 + Math.random() * 6);   // star 8–14px
      const isCircle  = size <= 10;
      const color     = COLORS[Math.floor(Math.random() * COLORS.length)];
      const opacity   = 0.6 + Math.random() * 0.4; // 0.6–1.0
      // Speed 40–120px/s over 1200ms ≈ 48–144px; use distance as proxy

      const el = document.createElement('div');
      el.className = 'particle';
      el.style.cssText = `
        left: ${centerX}px;
        top: ${centerY}px;
        width: ${size}px;
        height: ${size}px;
        --dx: ${dx}px;
        --dy: ${dy}px;
        --opacity: ${opacity};
        background: ${isCircle ? color : 'none'};
        border-radius: ${isCircle ? '50%' : '0'};
        color: ${!isCircle ? color : 'transparent'};
        font-size: ${size}px;
        line-height: 1;
        transform: translate(-50%, -50%);
      `;
      el.textContent = isCircle ? '' : '★';
      el.setAttribute('aria-hidden', 'true');

      particleContainerEl.appendChild(el);

      // Remove from DOM after animation completes (1200ms + 100ms buffer)
      setTimeout(() => {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 1300);
    }
  }

  // ─── DOM Element References ────────────────────────────────────────────────
  const counterValueEl  = document.getElementById('counter-value');
  const moodLabelEl     = document.getElementById('mood-label');
  const reactionTextEl  = document.getElementById('reaction-text');
  const characterSvgEl  = document.getElementById('character-svg');
  const glowRingEl      = document.getElementById('glow-ring');
  const particleContainerEl = document.getElementById('particle-container');

  // ─── Animation timer references (for restart-on-retrigger) ────────────────
  let scaleTimer    = null;
  let glowTimer     = null;
  let activeTimer   = null;
  let animLockTimer = null;

  // ─── handleInteraction() ──────────────────────────────────────────────────
  function handleInteraction() {
    // 1. Debounce guard
    if (state.isAnimating) return;
    state.isAnimating = true;

    // 2. Increment counter
    state.interactionCount++;
    if (counterValueEl) counterValueEl.textContent = state.interactionCount;

    // 3. Select new mood (different from current)
    const newMood = selectDifferent(MOOD_LABELS, state.currentMood);
    state.currentMood = newMood;
    if (moodLabelEl) {
      moodLabelEl.style.opacity = '0';
      setTimeout(() => {
        moodLabelEl.textContent = newMood;
        moodLabelEl.style.opacity = '1';
      }, 150);
    }

    // 4. Select new quote (different from current)
    const newQuote = selectDifferent(QUOTES, state.currentQuote);
    state.currentQuote = newQuote;
    if (reactionTextEl) {
      reactionTextEl.style.opacity = '0';
      reactionTextEl.style.transform = 'translateY(8px)';
      setTimeout(() => {
        reactionTextEl.textContent = newQuote;
        reactionTextEl.style.transition = 'opacity 300ms ease, transform 300ms ease';
        reactionTextEl.style.opacity = '1';
        reactionTextEl.style.transform = 'translateY(0)';
      }, 50);
    }

    // 5. Trigger scale animation on character
    triggerScaleAnimation();

    // 6. Trigger glow ring animation
    triggerGlowAnimation();

    // 7. Trigger character active state
    triggerCharacterActive();

    // 8. Spawn particles
    const count = Math.floor(Math.random() * 7) + 6; // 6–12
    spawnParticles(count);

    // 9. Release animation lock after scale animation completes (400ms)
    clearTimeout(animLockTimer);
    animLockTimer = setTimeout(() => {
      state.isAnimating = false;
    }, 400);
  }

  // ─── Expose for test harness ──────────────────────────────────────────────
  window.handleInteraction = handleInteraction;
  window.triggerInteractionDirect = function() {
    // Direct trigger for testing — bypasses debounce lock reset
    state.interactionCount++;
    const newMood  = selectDifferent(MOOD_LABELS, state.currentMood);
    state.currentMood = newMood;
    const newQuote = selectDifferent(QUOTES, state.currentQuote);
    state.currentQuote = newQuote;
  };
  window.resetState = function() {
    state.interactionCount = 0;
    state.currentMood = 'CALM';
    state.currentQuote = null;
    state.isAnimating = false;
  };
  window.spawnParticles = spawnParticles;
  window.particleContainerEl = particleContainerEl;

  // ─── Event Bindings (temporary — full wiring done in task 13.1) ───────────
  if (characterSvgEl) {
    characterSvgEl.addEventListener('click', handleInteraction);
    characterSvgEl.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleInteraction();
      }
    });
  }

  const ctaButtonEl = document.getElementById('cta-button');
  if (ctaButtonEl) {
    ctaButtonEl.addEventListener('click', handleInteraction);
  }
  </script>
</body>
</html>
